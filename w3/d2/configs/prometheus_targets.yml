global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: frontend
    static_configs:
      - targets: ['frontend:8080']

  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:8081']

  - job_name: payment-svc
    static_configs:
      - targets: ['payment-svc:8082']

  - job_name: inventory-svc
    static_configs:
      - targets: ['inventory-svc:8083']

  - job_name: checkout-svc
    static_configs:
      - targets: ['checkout-svc:8084']

  - job_name: auth-svc
    static_configs:
      - targets: ['auth-svc:8085']

  - job_name: notification-svc
    static_configs:
      - targets: ['notification-svc:8086']

  - job_name: log-collector
    static_configs:
      - targets: ['log-collector:8087']

  - job_name: dns-resolver
    static_configs:
      - targets: ['dns-resolver:8088']

  - job_name: aiops-pipeline
    static_configs:
      - targets: ['aiops-pipeline:8000']
