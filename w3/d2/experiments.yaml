# 10 chaos experiments — all entries filled
# Each entry has ALL 5 fields per §5

experiments:

  - id: 1
    name: payment_latency
    fault_type: latency
    target: payment-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, p99 latency < 500ms.
      Injecting 500ms ± 100ms delay on payment-svc network egress for 60s,
      pipeline detector fires latency anomaly within 30s and RCA picks payment-svc.
      probe pass-rate may drop to 70-80% during inject (acceptable).
    blast_radius:
      target: 1 instance of payment-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, p99_latency, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-svc
      expected_fault_class: latency

  - id: 2
    name: payment_network_loss
    fault_type: network_loss
    target: payment-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, error_rate < 0.5%.
      Injecting 30% packet loss on payment-svc network for 60s,
      pipeline detector fires error_rate anomaly within 45s and RCA picks payment-svc.
      probe pass-rate expected to drop to 60-70% during inject.
    blast_radius:
      target: 1 instance of payment-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 40% for 20s
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, error_rate, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-svc
      expected_fault_class: network_loss

  - id: 3
    name: inventory_pod_kill
    fault_type: availability
    target: inventory-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, inventory-svc availability = 100%.
      Killing inventory-svc container every 60s for 180s total,
      pipeline detector fires availability anomaly within 30s and RCA picks inventory-svc.
      probe pass-rate may drop to 80-90% during restarts (k8s reschedule lag).
    blast_radius:
      target: 1 instance of inventory-svc
      duration_seconds: 180
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 30s
      method: docker start inventory-svc
    measurement:
      metrics: [probe_pass_rate, availability, restart_count, detector_alerts, rca_root_service]
      capture_window_seconds: 360
    ground_truth:
      expected_root_service: inventory-svc
      expected_fault_class: availability

  - id: 4
    name: apigateway_cpu_stress
    fault_type: cpu_saturation
    target: api-gateway
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, api-gateway CPU < 70%, all downstream p99 < 500ms.
      Stressing api-gateway CPU to 90% for 60s,
      pipeline detects cascading latency increase across ALL downstream services
      (payment-svc, inventory-svc, checkout-svc) within 45s. RCA picks api-gateway.
    blast_radius:
      target: 1 instance of api-gateway
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 30% for 20s
      method: docker stop stressng-api-gateway
    measurement:
      metrics: [probe_pass_rate, cpu_usage, downstream_p99_latency, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: api-gateway
      expected_fault_class: cpu_saturation

  - id: 5
    name: paymentdb_memory_fill
    fault_type: memory
    target: payment-db
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, payment-db connection pool usage < 50%.
      Filling payment-db memory to 95% for 60s,
      pipeline detects connection pool exhaustion and query timeout anomalies within 45s.
      RCA picks payment-db (upstream of payment-svc).
    blast_radius:
      target: 1 instance of payment-db
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 40% for 20s
      method: docker stop stressng-payment-db
    measurement:
      metrics: [probe_pass_rate, memory_usage, connection_pool_usage, query_timeout_rate, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-db
      expected_fault_class: memory

  - id: 6
    name: authsvc_clock_skew
    fault_type: time_skew
    target: auth-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, JWT validation success rate >= 99.9%.
      Injecting +60s clock skew on auth-svc for 60s,
      JWT tokens issued by auth-svc appear expired to downstream validators,
      pipeline detects auth failure spike within 30s and RCA picks auth-svc.
    blast_radius:
      target: 1 instance of auth-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: docker exec auth-svc date -s now
    measurement:
      metrics: [probe_pass_rate, jwt_failure_rate, auth_error_count, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: auth-svc
      expected_fault_class: time_skew

  - id: 7
    name: logcollector_disk_fill
    fault_type: disk_fill
    target: log-collector
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, log ingestion lag < 5s.
      Filling log-collector disk to 95% for 60s,
      log ingestion stops or severely lags. Pipeline meta-monitoring detects
      log ingestion anomaly within 60s. RCA picks log-collector.
      Note: user-facing probe may NOT degrade — this tests meta-monitoring capability.
    blast_radius:
      target: 1 instance of log-collector
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: log_ingestion_lag > 60s
      method: docker exec log-collector rm -f /tmp/diskfill
    measurement:
      metrics: [log_ingestion_lag, disk_usage, log_drop_rate, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: log-collector
      expected_fault_class: disk_fill

  - id: 8
    name: gateway_network_partition
    fault_type: network_partition
    target: api-gateway
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Injecting full network partition between frontend and api-gateway for 30s,
      all downstream services become unreachable. Pipeline detects all-downstream
      timeout cascade within 15s. RCA picks api-gateway (edge ingress point).
      Probe pass-rate expected to drop to ~0% during partition.
    blast_radius:
      target: frontend <-> api-gateway link
      duration_seconds: 30
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 10% for 10s
      method: iptables -F INPUT
    measurement:
      metrics: [probe_pass_rate, downstream_timeout_rate, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: api-gateway
      expected_fault_class: network_partition

  - id: 9
    name: dns_slow_lookup
    fault_type: dns_latency
    target: dns-resolver
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, DNS resolution < 50ms.
      Injecting +2s DNS lookup delay on dns-resolver for 60s,
      intermittent connection errors appear across services that re-resolve DNS.
      Pipeline detects intermittent error pattern within 60s.
      RCA result is topology-dependent — dns-resolver if topology graph is complete.
    blast_radius:
      target: 1 instance of dns-resolver
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 30s
      method: toxiproxy-cli toxic remove --toxicName dns_latency dns-resolver
    measurement:
      metrics: [probe_pass_rate, dns_resolution_time, intermittent_error_rate, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: dns-resolver
      expected_fault_class: dns_latency

  - id: 10
    name: checkout_retry_storm
    fault_type: http_error
    target: checkout-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Injecting 20% HTTP 500 on checkout-svc responses for 90s, client retries
      amplify load on upstream payment-svc + inventory-svc. Pipeline must NOT
      pick checkout-svc as root (it's the symptom carrier, not cause). RCA
      should pick payment-svc OR inventory-svc (whichever shows queue depth).
    blast_radius:
      target: 100% of checkout-svc requests
      duration_seconds: 90
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 30% for 30s
      method: toxiproxy-cli toxic remove
    measurement:
      metrics: [probe_pass_rate, retry_count, upstream_queue_depth, rca_root_service]
      capture_window_seconds: 600
    ground_truth:
      expected_root_service: NOT checkout-svc  # negative test
      expected_fault_class: cascade_retry
